<!DOCTYPE html>
<html lang="en" ng-app="todoApp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5" ng-controller="TodoController">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h2 class="mb-0"><i class="fas fa-tasks"></i> Todo List Application</h2>
                    </div>
                    <div class="card-body">
                        <!-- Add Todo Form -->
                        <form ng-submit="addTodo()" class="mb-4">
                            <div class="row">
                                <div class="col-md-5">
                                    <input type="text"
                                           class="form-control"
                                           ng-model="newTodo.title"
                                           placeholder="Enter todo title..."
                                           required>
                                </div>
                                <div class="col-md-5">
                                    <input type="text"
                                           class="form-control"
                                           ng-model="newTodo.description"
                                           placeholder="Enter description...">
                                </div>
                                <div class="col-md-2">
                                    <button type="submit"
                                            class="btn btn-success w-100"
                                            ng-disabled="loading">
                                        <i class="fas fa-plus"></i> Add
                                    </button>
                                </div>
                            </div>
                        </form>

                        <!-- Filter Buttons -->
                        <div class="mb-3">
                            <div class="btn-group" role="group">
                                <button type="button"
                                        class="btn btn-outline-secondary"
                                        ng-class="{'active': filter === 'all'}"
                                        ng-click="setFilter('all')">
                                    All ({{todos.length}})
                                </button>
                                <button type="button"
                                        class="btn btn-outline-warning"
                                        ng-class="{'active': filter === 'pending'}"
                                        ng-click="setFilter('pending')">
                                    Pending ({{getPendingCount()}})
                                </button>
                                <button type="button"
                                        class="btn btn-outline-success"
                                        ng-class="{'active': filter === 'completed'}"
                                        ng-click="setFilter('completed')">
                                    Completed ({{getCompletedCount()}})
                                </button>
                            </div>
                        </div>

                        <!-- Loading Indicator -->
                        <div ng-show="loading" class="text-center mb-3">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </div>

                        <!-- Todo List -->
                        <div ng-show="!loading">
                            <div ng-show="filteredTodos.length === 0" class="alert alert-info text-center">
                                <i class="fas fa-info-circle"></i> No todos found.
                            </div>

                            <div ng-repeat="todo in filteredTodos" class="todo-item mb-3">
                                <div class="card" ng-class="{'completed-todo': todo.completed}">
                                    <div class="card-body">
                                        <div class="row align-items-center">
                                            <div class="col-md-1">
                                                <input type="checkbox"
                                                       class="form-check-input"
                                                       ng-model="todo.completed"
                                                       ng-change="toggleTodo(todo)">
                                            </div>
                                            <div class="col-md-8">
                                                <div ng-show="!todo.editing">
                                                    <h5 class="mb-1" ng-class="{'text-decoration-line-through': todo.completed}">
                                                        {{todo.title}}
                                                    </h5>
                                                    <p class="mb-1 text-muted" ng-show="todo.description">
                                                        {{todo.description}}
                                                    </p>
                                                    <small class="text-muted">
                                                        Created: {{formatDate(todo.createdAt)}}
                                                        <span ng-show="todo.updatedAt !== todo.createdAt">
                                                            | Updated: {{formatDate(todo.updatedAt)}}
                                                        </span>
                                                    </small>
                                                </div>
                                                <div ng-show="todo.editing">
                                                    <input type="text"
                                                           class="form-control mb-2"
                                                           ng-model="todo.editTitle">
                                                    <input type="text"
                                                           class="form-control"
                                                           ng-model="todo.editDescription"
                                                           placeholder="Description (optional)">
                                                </div>
                                            </div>
                                            <div class="col-md-3">
                                                <div ng-show="!todo.editing">
                                                    <button class="btn btn-sm btn-outline-primary me-1"
                                                            ng-click="editTodo(todo)">
                                                        <i class="fas fa-edit"></i>
                                                    </button>
                                                    <button class="btn btn-sm btn-outline-danger"
                                                            ng-click="deleteTodo(todo)">
                                                        <i class="fas fa-trash"></i>
                                                    </button>
                                                </div>
                                                <div ng-show="todo.editing">
                                                    <button class="btn btn-sm btn-success me-1"
                                                            ng-click="saveTodo(todo)">
                                                        <i class="fas fa-save"></i>
                                                    </button>
                                                    <button class="btn btn-sm btn-secondary"
                                                            ng-click="cancelEdit(todo)">
                                                        <i class="fas fa-times"></i>
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/controllers/todoController.js"></script>
    <script src="js/services/todoService.js"></script>
</body>
</html>
